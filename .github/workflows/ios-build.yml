name: iOS device build (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios/package-lock.json

      - name: Install JS dependencies
        working-directory: ios
        run: npm ci

      - name: Generate native iOS project
        working-directory: ios
        run: npx expo prebuild -p ios --no-install

      - name: Install CocoaPods
        working-directory: ios/ios
        run: pod install

      - name: Build unsigned device app
        working-directory: ios/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Semester.xcworkspace \
            -scheme Semester \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tail -50

      - name: Package unsigned .ipa
        run: |
          mkdir Payload
          cp -R ios/ios/build/Build/Products/Release-iphoneos/Semester.app Payload/
          zip -qry Semester-unsigned.ipa Payload
          ls -la Semester-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Semester-unsigned-ipa
          path: Semester-unsigned.ipa
          retention-days: 30
