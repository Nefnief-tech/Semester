name: iOS device build (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios/package-lock.json

      - name: Install JS dependencies
        working-directory: ios
        run: npm ci

      - name: Generate native iOS project
        working-directory: ios
        run: npx expo prebuild -p ios --no-install

      - name: Locate native project
        id: native
        working-directory: ios
        run: |
          if [ -f Podfile ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "dir=ios" >> "$GITHUB_OUTPUT"
          fi

      - name: Disable expo-updates dev-client autodetection
        # this is a production app — no expo-dev-client is installed, and the
        # podspec's probe crashes pod install when the module is missing
        working-directory: ios
        run: |
          perl -0777 -pi -e 's/use_dev_client = false\nbegin\n.*?\nend\n/use_dev_client = false\n/s' \
            node_modules/expo-updates/ios/EXUpdates.podspec

      - name: Install CocoaPods
        working-directory: ios
        run: pod install ${{ steps.native.outputs.dir == 'ios' && ' --project-directory=ios' || '' }}

      - name: Build unsigned device app
        working-directory: ios
        run: |
          set -o pipefail
          NATIVE_DIR="${{ steps.native.outputs.dir }}"
          xcodebuild \
            -workspace "$NATIVE_DIR/Semester.xcworkspace" \
            -scheme Semester \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$NATIVE_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee /tmp/xcbuild.log | tail -50

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcbuild.log

      - name: Package unsigned .ipa
        run: |
          NATIVE_DIR="${{ steps.native.outputs.dir }}"
          mkdir Payload
          cp -R "ios/$NATIVE_DIR/build/Build/Products/Release-iphoneos/Semester.app" Payload/
          zip -qry Semester-unsigned.ipa Payload
          ls -la Semester-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Semester-unsigned-ipa
          path: Semester-unsigned.ipa
          retention-days: 30
