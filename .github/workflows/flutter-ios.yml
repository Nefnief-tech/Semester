name: Flutter iOS build (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-ios.yml'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.1
          channel: stable
          cache: true

      - name: Enable iOS platform (generated on CI, not committed)
        working-directory: mobile
        run: flutter create --platforms=ios --project-name semester --org com.semesterapp .

      - name: Apply the Semester app icon
        run: |
          ICONSET=mobile/ios/Runner/Assets.xcassets/AppIcon.appiconset
          rm -f "$ICONSET"/Icon-App*.png
          cp mobile/ios_assets/AppIcon-1024.png "$ICONSET/AppIcon-1024.png"
          cat > "$ICONSET/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON
          ls "$ICONSET"

      - name: Raise iOS deployment target to 15.0
        # template defaults to 13.0; file_picker_darwin needs ≥14, Firebase 12.x ≥15
        working-directory: mobile/ios
        run: |
          perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = 13\.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' Runner.xcodeproj/project.pbxproj
          if grep -q "platform :ios" Podfile; then
            perl -pi -e "s/platform :ios, '[0-9.]+'/platform :ios, '15.0'/" Podfile
          else
            perl -pi -e "print \"platform :ios, '15.0'\\n\" if \$. == 1" Podfile
          fi
          grep -c "IPHONEOS_DEPLOYMENT_TARGET = 15.0" Runner.xcodeproj/project.pbxproj
          grep -n "platform :ios" Podfile

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build unsigned device app
        working-directory: mobile
        run: flutter build ios --release --no-codesign

      - name: Brand the bundle and add the semester:// deeplink scheme
        run: |
          PLIST=mobile/build/ios/iphoneos/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Semester" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Semester" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string semester" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string semester" "$PLIST" 2>/dev/null || true

      - name: Package unsigned .ipa
        run: |
          mkdir Payload
          cp -R mobile/build/ios/iphoneos/Runner.app Payload/
          zip -qry Semester-flutter-unsigned.ipa Payload
          ls -la Semester-flutter-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Semester-flutter-unsigned-ipa
          path: Semester-flutter-unsigned.ipa
          retention-days: 30
